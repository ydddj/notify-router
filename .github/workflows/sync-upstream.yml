name: Sync fork with upstream

on:
  schedule:
    # 03:15 Asia/Shanghai = 19:15 UTC (previous day)
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/anlostyle/notify-router.git
          else
            git remote add upstream https://github.com/anlostyle/notify-router.git
          fi
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork master already contains upstream/master; nothing to push."
            exit 0
          fi

          git merge --no-edit upstream/master
          git push origin master
