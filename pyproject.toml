[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notify-router"
version = "0.6.15"
description = "Clean-room NotifyHub-compatible notification router"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "cacheout>=0.16,<1",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "tenacity>=9,<10",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
notify-router = "notifyhub.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notifyhub = ["static/*", "emby_templates.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
