services:
  notify-router:
    image: ${NOTIFY_IMAGE:-anlostyle/notify-router}:${NOTIFY_VERSION:-0.6.15}
    build:
      context: ..
    container_name: notify-router
    ports:
      - "${NOTIFY_BIND:-127.0.0.1}:5401:5400"
    volumes:
      - /appdata/notify-router/data:/data
    env_file:
      - /opt/notify-router/.env
    environment:
      WORKDIR: /data
      TZ: Asia/Shanghai
      INSTALL_PLUGIN_REQUIREMENTS: "1"
      PLUGIN_TASKS_ENABLED: "${PLUGIN_TASKS_ENABLED:-1}"
      ADMIN_RESTART_ENABLED: "1"
      COOKIE_SECURE: "1"
      ACCESS_LOG: "0"
    restart: unless-stopped
