  <section id="login-view" class="login-view">
    <div class="login-actions"><button class="icon-button" data-action="toggle-palette" type="button" aria-label="切换配色" title="切换配色"><svg><use href="#i-palette"/></svg></button><button class="icon-button theme-button" data-action="toggle-theme" type="button" aria-label="切换深浅主题" title="切换深浅主题"><svg><use id="login-theme-icon" href="#i-moon"/></svg></button></div>
    <div class="login-art" aria-hidden="true">
      <div class="login-orb orb-one"></div><div class="login-orb orb-two"></div>
      <div class="login-message-card card-one"><span class="mini-icon">✓</span><div><strong>投递成功</strong><small>企业微信 · 刚刚</small></div></div>
      <div class="login-message-card card-two"><span class="mini-icon">↗</span><div><strong>统一通知中心</strong><small>一个入口管理所有消息</small></div></div>
      <div class="login-brand"><span class="brand-mark">N</span><span>Notify</span></div>
      <div class="login-copy"><h1>让每一条通知<br>都准确抵达。</h1><p>集中管理通知渠道、路由、模板和投递记录。</p></div>
    </div>
    <div class="login-panel">
      <form id="login-form" class="login-form">
        <div class="login-topline"><div class="mobile-brand"><span class="brand-mark">N</span><span>Notify</span></div></div>
        <p class="eyebrow">欢迎回来</p>
        <h2>登录管理中心</h2>
        <p class="form-intro">使用管理员账户继续</p>
        <label class="field"><span>用户名</span><input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="button primary wide" type="submit"><span>登录管理中心</span><svg><use href="#i-chevron"/></svg></button>
        <small class="login-footnote">凭据仅用于建立安全会话，不会保存在浏览器存储中。</small>
      </form>
    </div>
  </section>

    <main class="main">
      <header class="topbar">
        <button id="menu-button" class="icon-button menu-button" data-action="open-menu" aria-label="收起侧栏" aria-expanded="true"><svg><use id="menu-icon" href="#i-sidebar-collapse"/></svg></button>
        <div class="search"><svg><use href="#i-search"/></svg><input id="global-search" type="search" placeholder="搜索当前页面" aria-label="搜索当前页面"><kbd>⌘ K</kbd></div>
        <div class="topbar-actions">
          <span class="service-pill"><i></i><span>服务正常</span></span>
          <button class="icon-button" data-action="toggle-palette" aria-label="切换配色" title="切换配色"><svg><use href="#i-palette"/></svg></button>
          <button class="icon-button theme-button" data-action="toggle-theme" aria-label="切换主题" title="切换主题"><svg><use id="theme-icon" href="#i-moon"/></svg></button>
          <button class="icon-button" data-action="restart-service" aria-label="重启服务" title="重启服务"><svg><use href="#i-refresh"/></svg></button>
          <button class="user-button" data-action="user-menu" aria-haspopup="menu" aria-expanded="false"><span id="user-avatar">A</span><span class="user-meta"><strong id="username">admin</strong><small>管理员</small></span><svg><use href="#i-chevron"/></svg></button>
          <div id="user-menu" class="user-menu" role="menu" hidden><button class="user-menu-item" data-action="admin-note" type="button" role="menuitem"><svg><use href="#i-note"/></svg><span>备注</span></button><button class="user-menu-item" data-action="logout" type="button" role="menuitem"><svg><use href="#i-logout"/></svg><span>退出登录</span></button></div>
        </div>
      </header>

      <div class="content-wrap" id="main-content">
        <div class="page-header"><div><p id="page-eyebrow" class="eyebrow"></p><h1 id="page-title"></h1><p id="page-description"></p></div><div id="page-actions" class="page-actions"></div></div>
        <section id="page-content" class="page-content" aria-live="polite"></section>
      </div>
    </main>
